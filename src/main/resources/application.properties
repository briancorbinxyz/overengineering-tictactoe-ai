spring.application.name=overengineering-tictactoe-ai
spring.main.web-application-type=none

# Ollama on its default port. mistral has no "thinking" mode, which matters once
# the reply has to be JSON.
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=mistral
# Spring AI sends no context size unless set; Ollama then picks one from your VRAM
# (4K on most laptops). A whole game fits, but every branch says it explicitly so
# runs on different models are configured the same way.
spring.ai.ollama.chat.num-ctx=8192

# Spring AI 2.0 no longer sets a default temperature for most chat models.
# AlphaConfiguration sets it in code; this is the property-file equivalent.
# spring.ai.ollama.chat.temperature=0.4

# How many messages Alpha keeps per game. 20 is Spring AI's default window, and a
# whole 3x3 game (9 moves, 18 messages) fits inside it. Try 6 to watch it forget.
alpha.memory.max-messages=20

# duo: Alpha calls every move and Beta adds colour on quiet moves.
# solo: Alpha alone, offered the colour lines itself.
commentary.mode=duo

# The bots. AlphaBeta plays perfectly, so against MCTS nearly every game is a draw.
# Set game.x-strategy=RANDOM to see wins, and real win commentary, checked.
game.x-strategy=ALPHABETA
game.o-strategy=MCTS
