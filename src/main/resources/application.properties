spring.application.name=rags-spring-ai
spring.main.web-application-type=none

# --- Chat: both commentators run on one local model -------------------------------------
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:8b
# qwen3 "thinks" out loud unless told not to, and the reply has to be JSON.
spring.ai.ollama.chat.think=false
# Spring AI sends no context size unless told to, and Ollama then picks one from your VRAM
# (4K on most laptops). Four 800-token chunks plus the prompts do not fit in 4K.
spring.ai.ollama.chat.num-ctx=16384

# --- Embeddings: a second, separate model that turns text into numbers ------------------
spring.ai.ollama.embedding.model=nomic-embed-text:v1.5
# Fail loudly if a chunk is too long for the embedding model, instead of quietly cutting it.
spring.ai.ollama.embedding.truncate=false

# --- The archive: spectastic's specifications at one pinned tag ---------------------------
# git clone --depth 1 --branch v0.1.0-pre.28 https://github.com/spectastic/spectastic.git ../spectastic
spectastic.path=../spectastic
# The commit v0.1.0-pre.28 points at. A different commit still runs, with a warning.
spectastic.commit=c64d41c2e5d0d42c4fefd1b506cb083b9812bf6c

# --- What a run does --------------------------------------------------------------------
# golden: run the golden set and write results to build/. ask: one question (archive.question)
# or a conversation at the terminal. demo: the embedding demo. ingest: build the store only.
archive.run=golden
archive.question=
# duo: Beta finds, Alpha answers. solo: Alpha does both in one call.
archive.mode=duo
archive.golden=classpath:golden/questions.jsonl

# The store logs every chunk it embeds, and the splitter every file it splits; SpecCorpus
# reports progress instead.
logging.level.org.springframework.ai.vectorstore.SimpleVectorStore=WARN
logging.level.org.springframework.ai.transformer.splitter=WARN
